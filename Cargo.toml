[package]
name = "ipclc"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "Cross-platform IPv4 and IPv6 network calculator"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
insta = "1"

[package.metadata.docs.rs]
all-features = true
