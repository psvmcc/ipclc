name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ipclc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  build:
    name: Build (${{ matrix.os }})
    needs: check
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1

  licenses:
    name: Dependency license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84.0
      - run: cargo check --all-targets --all-features

  release:
    name: Release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, audit, licenses, msrv]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ipclc
            checksum: sha256sum
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: ipclc
            checksum: shasum -a 256
          - os: macos-14
            target: aarch64-apple-darwin
            binary: ipclc
            checksum: shasum -a 256
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ipclc.exe
            checksum: sha256sum
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          ARCHIVE="ipclc-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C "target/${{ matrix.target }}/release" "${{ matrix.binary }}"
          ${{ matrix.checksum }} "dist/${ARCHIVE}" > "dist/${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ipclc-${{ matrix.target }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ipclc-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: psvmcc/homebrew-tap
          # github.token can read a public tap when the write token is absent.
          # The push step below is guarded by TAP_TOKEN.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          path: homebrew-tap
      - name: Warn when tap write token is not configured
        if: env.TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not configured; the tap was checked out but will not be updated."
      - name: Update immutable formula source
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FORMULA="homebrew-tap/Formula/ipclc.rb"
          BASE="https://github.com/psvmcc/ipclc/releases/download/${GITHUB_REF_NAME}"
          curl --fail --location --retry 3 -o /tmp/linux.tar.gz "${BASE}/ipclc-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 -o /tmp/macos-intel.tar.gz "${BASE}/ipclc-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
          curl --fail --location --retry 3 -o /tmp/macos-arm.tar.gz "${BASE}/ipclc-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
          LINUX_SHA=$(sha256sum /tmp/linux.tar.gz | cut -d' ' -f1)
          MACOS_INTEL_SHA=$(sha256sum /tmp/macos-intel.tar.gz | cut -d' ' -f1)
          MACOS_ARM_SHA=$(sha256sum /tmp/macos-arm.tar.gz | cut -d' ' -f1)
          cat > "$FORMULA" <<EOF
          class Ipclc < Formula
            desc "Cross-platform IPv4 and IPv6 network calculator"
            homepage "https://github.com/psvmcc/ipclc"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/ipclc-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
                sha256 "${MACOS_ARM_SHA}"
              else
                url "${BASE}/ipclc-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
                sha256 "${MACOS_INTEL_SHA}"
              end
            end

            on_linux do
              url "${BASE}/ipclc-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${LINUX_SHA}"
            end

            def install
              bin.install "ipclc"
            end

            test do
              assert_match "192.168.1.0", shell_output("#{bin}/ipclc 192.168.1.42/24")
            end
          end
          EOF
      - name: Commit and push formula
        if: env.TAP_TOKEN != ''
        working-directory: homebrew-tap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ipclc.rb
          git diff --cached --quiet || git commit -m "ipclc ${GITHUB_REF_NAME}"
          git push
