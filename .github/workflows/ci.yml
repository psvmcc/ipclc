name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ipclc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  build:
    name: Build (${{ matrix.os }})
    needs: check
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1

  licenses:
    name: Dependency license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84.0
      - run: cargo check --all-targets --all-features

  release:
    name: Release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, audit, licenses, msrv]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ipclc
            checksum: sha256sum
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: ipclc
            checksum: shasum -a 256
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ipclc.exe
            checksum: sha256sum
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          ARCHIVE="ipclc-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/${ARCHIVE}" -C "target/${{ matrix.target }}/release" "${{ matrix.binary }}"
          ${{ matrix.checksum }} "dist/${ARCHIVE}" > "dist/${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ipclc-${{ matrix.target }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ipclc-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  homebrew:
    name: Update Homebrew tap
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: psvmcc/homebrew-ipclc
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-ipclc
      - name: Update immutable formula source
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FORMULA="homebrew-ipclc/Formula/ipclc.rb"
          sed -E -i "s/tag: \"v[^\"]+\"/tag: \"v${VERSION}\"/; s/version \"[^\"]+\"/version \"${VERSION}\"/" "$FORMULA"
          if grep -q '^  revision ' "$FORMULA"; then
            sed -E -i "s/revision \"[^\"]+\"/revision \"${GITHUB_SHA}\"/" "$FORMULA"
          else
            sed -i "/^  url /a\\  revision \"${GITHUB_SHA}\"" "$FORMULA"
          fi
      - name: Commit and push formula
        working-directory: homebrew-ipclc
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ipclc.rb
          git diff --cached --quiet || git commit -m "ipclc ${GITHUB_REF_NAME}"
          git push
