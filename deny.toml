# License policy for project dependencies.
# ipclc itself is MIT-licensed. Dependencies retain their own upstream
# licenses; the following permissive licenses are approved for distribution.
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[advisories]
db-path = "~/.cargo/advisory-db"
ignore = []
